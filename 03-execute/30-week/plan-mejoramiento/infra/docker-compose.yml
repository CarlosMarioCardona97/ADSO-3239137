# Archive: levanta PostgreSQL vacío y la API con un solo comando (RNF-5, T-20).
#   docker compose --env-file .env up --build
name: archive

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${DB_DATABASE}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      TZ: UTC
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./db/create-test-database.sh:/docker-entrypoint-initdb.d/create-test-database.sh:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_DATABASE}"]
      interval: 3s
      retries: 20

  api:
    build: ../api
    env_file: .env
    environment:
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  db-data:
