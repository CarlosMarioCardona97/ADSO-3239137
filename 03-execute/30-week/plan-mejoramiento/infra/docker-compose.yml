# Archive: levanta PostgreSQL vacío, la API y el sitio público con un solo comando (RNF-5, T-20).
#   docker compose --env-file .env up --build
name: archive

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${DB_DATABASE}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      TZ: UTC
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./db/create-test-database.sh:/docker-entrypoint-initdb.d/create-test-database.sh:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_DATABASE}"]
      interval: 3s
      retries: 20

  api:
    build: ../api
    env_file: .env
    environment:
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  page:
    image: nginx:1.27-alpine
    volumes:
      - ../page:/usr/share/nginx/html:ro
    ports:
      - "8088:80"

  # Solo con --profile seed: misma API y misma base, con el reloj 6 días atrás (plan D-15).
  api-past:
    profiles: [seed]
    build: ../api
    env_file: .env
    environment:
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      CLOCK_OFFSET_DAYS: -6
    entrypoint: ["php", "artisan", "serve", "--host=0.0.0.0", "--port=8000", "--no-reload"]
    depends_on:
      api:
        condition: service_started

  # Herramientas de ../tool: sembrador, prueba concurrente y prueba de carga.
  tool:
    profiles: [seed]
    build: ../api
    env_file: .env
    environment:
      API_URL: http://api:8000/api/v1
      API_PAST_URL: http://api-past:8000/api/v1
    volumes:
      - ../tool:/tool:ro
    entrypoint: ["php"]
    command: ["/tool/seed.php"]
    depends_on:
      api-past:
        condition: service_started

volumes:
  db-data:
